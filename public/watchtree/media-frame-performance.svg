<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Abstract performance media frame</title>
<desc id="desc">Original platform-neutral abstract frame representing performance</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F4CB84"/>
    <stop offset="1" stop-color="#D7A96F"/>
  </linearGradient>
  <linearGradient id="violetGlow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4D3C81"/>
    <stop offset="1" stop-color="#28234F"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#F4CB84" stop-opacity=".58"/>
    <stop offset=".55" stop-color="#D7A96F" stop-opacity=".18"/>
    <stop offset="1" stop-color="#D7A96F" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>

<rect x="74" y="120" width="652" height="440" rx="34" fill="#121329" stroke="#3D3B51" stroke-width="5"/>
<rect x="105" y="151" width="590" height="378" rx="22" fill="url(#violetGlow)"/>

<path d="M115 180 H685 V500 H115 Z" fill="#170D23"/>
<path d="M170 174 L260 500 M310 174 L360 500 M500 174 L430 500 M630 174 L530 500" stroke="#D7A96F" stroke-width="25" opacity=".24"/>
<circle cx="395" cy="283" r="56" fill="#B98383"/>
<path d="M337 463 C344 353 365 329 402 329 C440 329 468 372 474 463 Z" fill="#F4ECDD" opacity=".82"/>
<path d="M400 326 L348 420 M410 330 L468 405" stroke="#B98383" stroke-width="18" stroke-linecap="round"/>
<circle cx="166" cy="462" r="20" fill="#D7A96F" opacity=".6"/>
<circle cx="632" cy="448" r="17" fill="#B98383" opacity=".55"/>

<rect x="74" y="590" width="420" height="18" rx="9" fill="#3D3B51"/>
<rect x="74" y="590" width="238" height="18" rx="9" fill="#B98383"/>
<circle cx="665" cy="600" r="18" fill="#D7A96F" opacity=".85"/>
<text x="78" y="670" fill="#CFC7BA" font-family="Arial, sans-serif" font-size="30" letter-spacing="4">PERFORMANCE</text>

</svg>