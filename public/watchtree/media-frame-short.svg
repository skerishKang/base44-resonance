<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Abstract short media frame</title>
<desc id="desc">Original platform-neutral abstract frame representing short</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F4CB84"/>
    <stop offset="1" stop-color="#D7A96F"/>
  </linearGradient>
  <linearGradient id="violetGlow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4D3C81"/>
    <stop offset="1" stop-color="#28234F"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#F4CB84" stop-opacity=".58"/>
    <stop offset=".55" stop-color="#D7A96F" stop-opacity=".18"/>
    <stop offset="1" stop-color="#D7A96F" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>

<rect x="74" y="120" width="652" height="440" rx="34" fill="#121329" stroke="#3D3B51" stroke-width="5"/>
<rect x="105" y="151" width="590" height="378" rx="22" fill="url(#violetGlow)"/>

<rect x="290" y="163" width="220" height="350" rx="28" fill="#211936" stroke="#F4ECDD" stroke-opacity=".18" stroke-width="4"/>
<circle cx="400" cy="275" r="62" fill="#D7A96F" opacity=".7"/>
<path d="M355 401 C368 327 389 314 412 314 C441 314 461 351 466 401 Z" fill="#B98383"/>
<path d="M332 204 L474 476" stroke="#F4ECDD" stroke-width="4" opacity=".18"/>
<circle cx="543" cy="210" r="15" fill="#B98383"/>
<circle cx="543" cy="258" r="15" fill="#D7A96F"/>
<circle cx="543" cy="306" r="15" fill="#A8C8AC"/>

<rect x="74" y="590" width="420" height="18" rx="9" fill="#3D3B51"/>
<rect x="74" y="590" width="238" height="18" rx="9" fill="#F4CB84"/>
<circle cx="665" cy="600" r="18" fill="#28234F" opacity=".85"/>
<text x="78" y="670" fill="#CFC7BA" font-family="Arial, sans-serif" font-size="30" letter-spacing="4">SHORT</text>

</svg>