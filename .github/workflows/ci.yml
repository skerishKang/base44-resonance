name: CI

on:
  pull_request:
  push:
    branches:
      - feat/resonance-buildoff-mvp
      - feat/watchtree-private-import-mvp

permissions:
  contents: read

jobs:
  test-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload temporary source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: temporary-source-snapshot
          path: |
            .github/
            base44/
            docs/
            public/
            src/
            tests/
            index.html
            package.json
            package-lock.json
            vite.config.js
          include-hidden-files: true
          if-no-files-found: error
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run deterministic tests
        run: |
          mkdir -p tests/evidence
          npm run test:ci 2>&1 | tee tests/evidence/test-ci.log
      - name: Build Vite site
        run: npm run build
      - name: Install browser validation runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Run WatchTree browser validation
        run: npm run test:browser
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchtree-browser-evidence
          path: tests/evidence/
          if-no-files-found: error
