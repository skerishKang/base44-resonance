<rect x="136" y="424" width="215" height="20" fill="#F4ECDD" opacity=".68"/>
<rect x="136" y="457" width="162" height="12" fill="#F4ECDD" opacity=".38"/>

<rect x="74" y="590" width="420" height="18" rx="9" fill="#3D3B51"/>
<rect x="74" y="590" width="238" height="18" rx="9" fill="#A8C8AC"/>
<circle cx="665" cy="600" r="18" fill="#7E9DB7" opacity=".85"/>
<text x="78" y="670" fill="#CFC7BA" font-family="Arial, sans-serif" font-size="30" letter-spacing="4">DOCUMENTARY</text>

</svg>