name: CI

on:
  pull_request:
  push:
    branches:
      - feat/resonance-buildoff-mvp
      - feat/watchtree-private-import-mvp

permissions:
  contents: read

jobs:
  test-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run deterministic tests
        run: npm run test:ci
      - name: Build Vite site
        run: npm run build
      - name: Install browser validation runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Run WatchTree browser validation
        run: npm run test:browser
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchtree-browser-evidence
          path: tests/evidence/
          if-no-files-found: error
