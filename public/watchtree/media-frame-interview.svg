<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Abstract interview media frame</title>
<desc id="desc">Original platform-neutral abstract frame representing interview</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F4CB84"/>
    <stop offset="1" stop-color="#D7A96F"/>
  </linearGradient>
  <linearGradient id="violetGlow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4D3C81"/>
    <stop offset="1" stop-color="#28234F"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#F4CB84" stop-opacity=".58"/>
    <stop offset=".55" stop-color="#D7A96F" stop-opacity=".18"/>
    <stop offset="1" stop-color="#D7A96F" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>

<rect x="74" y="120" width="652" height="440" rx="34" fill="#121329" stroke="#3D3B51" stroke-width="5"/>
<rect x="105" y="151" width="590" height="378" rx="22" fill="url(#violetGlow)"/>

<circle cx="290" cy="325" r="96" fill="#B98383"/>
<path d="M205 470 C220 385 259 359 294 359 C341 359 376 396 389 470 Z" fill="#0B0B1A"/>
<rect x="442" y="228" width="158" height="18" rx="9" fill="#F4ECDD" opacity=".75"/>
<rect x="442" y="271" width="112" height="12" rx="6" fill="#F4ECDD" opacity=".35"/>
<rect x="442" y="306" width="138" height="12" rx="6" fill="#F4ECDD" opacity=".25"/>
<path d="M438 394 C485 370 530 370 608 416" fill="none" stroke="#D7A96F" stroke-width="9" stroke-linecap="round"/>

<rect x="74" y="590" width="420" height="18" rx="9" fill="#3D3B51"/>
<rect x="74" y="590" width="238" height="18" rx="9" fill="#D7A96F"/>
<circle cx="665" cy="600" r="18" fill="#B98383" opacity=".85"/>
<text x="78" y="670" fill="#CFC7BA" font-family="Arial, sans-serif" font-size="30" letter-spacing="4">INTERVIEW</text>

</svg>