name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/resonance-buildoff-mvp
      - feat/watchtree-private-import-mvp

permissions:
  contents: read

jobs:
  test-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Base44 shared function parity
        run: |
          npm run sync:base44-shared
          npm run check:base44-shared
      - name: Run deterministic tests
        run: |
          mkdir -p tests/evidence
          npm run test:ci 2>&1 | tee tests/evidence/test-ci.log
      - name: Build Vite site
        run: npm run build
      - name: Install browser validation runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Run WatchTree browser validation
        run: npm run test:browser
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchtree-browser-evidence
          path: tests/evidence/
          if-no-files-found: error

  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prove release build fails closed without an App ID
        run: |
          if npm run build:release; then
            echo "release build unexpectedly succeeded without VITE_BASE44_APP_ID" >&2
            exit 1
          fi
          echo "release build failed closed as required"
      - name: Build production release bundle
        run: npm run build:release
        env:
          # Public Base44 application identifier — not a credential or secret.
          VITE_BASE44_APP_ID: 6a6538c71a8e3e1640117c91
      - name: Assert release bundle contents
        run: npm run check:release-bundle
      - name: Upload production release bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-bundle
          path: dist/
          if-no-files-found: warn
